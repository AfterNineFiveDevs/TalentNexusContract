name: Validate promotion pull request

on:
  pull_request:
    branches: [dev, staging, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - name: Validate promotion policy
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          TARGET_BRANCH: ${{ github.event.pull_request.base.ref }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          [[ "$HEAD_BRANCH" == feature/* ]] || { echo "Only feature/* branches may target environment branches." >&2; exit 1; }
          if [[ "$TARGET_BRANCH" == "dev" ]]; then
            LABEL_COUNT="$(jq '[.[] | select(test("^release:(major|minor|patch)$"))] | length' <<< "$LABELS")"
            [[ "$LABEL_COUNT" == "1" ]] || { echo "Dev promotions require exactly one release:major, release:minor, or release:patch label." >&2; exit 1; }
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
