name: Publish staging release

on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Existing staging merge commit SHA to recover
        required: true
        type: string

permissions:
  contents: write

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_branch: ${{ steps.source.outputs.source_branch }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      target_sha: ${{ steps.source.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.merge_sha || github.sha }}
          fetch-depth: 0
      - name: Identify the locally merged feature branch
        id: source
        run: |
          set -euo pipefail
          read -r -a PARENTS <<< "$(git rev-list --parents -n 1 HEAD)"
          [[ "${#PARENTS[@]}" == "3" ]] || { echo "A promotion push must be a non-fast-forward merge commit." >&2; exit 1; }
          SUBJECT="$(git log -1 --format=%s)"
          SOURCE_BRANCH="$(sed -nE "s/^Merge branch '(feature\/[^']+)' into staging$/\1/p" <<< "$SUBJECT")"
          SOURCE_BRANCH="${SOURCE_BRANCH:-$(sed -nE 's/^Merge pull request #[0-9]+ from [^/]+\/(feature\/[^ ]+)$/\1/p' <<< "$SUBJECT")}"
          [[ -n "$SOURCE_BRANCH" ]] || { echo "Merge a feature/* branch with a merge commit." >&2; exit 1; }
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_sha=${PARENTS[2]}" >> "$GITHUB_OUTPUT"
          echo "target_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: version
        env:
          SOURCE_BRANCH: ${{ steps.source.outputs.source_branch }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          set -euo pipefail
          DEV_TAG=""
          for tag in $(git tag -l 'v*-dev.*' --sort=-version:refname); do
            metadata="$(git tag -l --format='%(contents)' "$tag")"
            if grep -Fxq "source_branch=$SOURCE_BRANCH" <<< "$metadata" && grep -Fxq "source_sha=$SOURCE_SHA" <<< "$metadata"; then
              DEV_TAG="$tag"
              break
            fi
          done
          [[ -n "$DEV_TAG" ]] || { echo "No dev release tag matches this feature head." >&2; exit 1; }
          BASE="$(sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-dev\.[0-9]+$/\1/' <<< "$DEV_TAG")"
          git rev-parse -q --verify "refs/tags/v$BASE" >/dev/null && { echo "Stable version $BASE already exists." >&2; exit 1; }
          NEXT="$(git tag -l "v$BASE-pre.*" | sed -nE "s/^v$BASE-pre\.([0-9]+)$/\1/p" | sort -n | tail -n 1)"
          echo "version=$BASE-pre.$(( ${NEXT:-0} + 1 ))" >> "$GITHUB_OUTPUT"
  publish:
    needs: resolve-version
    uses: ./.github/workflows/npm-publish.yml
    with:
      channel: staging
      version: ${{ needs.resolve-version.outputs.version }}
      npm_dist_tag: pre
      target_branch: staging
      target_sha: ${{ needs.resolve-version.outputs.target_sha }}
      source_branch: ${{ needs.resolve-version.outputs.source_branch }}
      source_sha: ${{ needs.resolve-version.outputs.source_sha }}
    secrets:
      npm_token: ${{ secrets.NPM_TOKEN }}
