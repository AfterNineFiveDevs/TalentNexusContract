syntax = "proto3";

package talentnexus.ingestion.v1;

service JobIngestionService {
  rpc ClaimWork(WorkerRequest) returns (WorkerResponse);
  rpc RenewLease(WorkerRequest) returns (WorkerResponse);
  rpc CompleteRun(WorkerRequest) returns (WorkerResponse);
  rpc IngestJobs(IngestJobsRequest)
  returns (IngestJobsResponse);
}

message IngestJobsRequest {
  string              source_id = 1;
  repeated ScrapedJob jobs      = 2;
  optional string run_id = 3;
  optional string lease_token = 4;
  optional string batch_id = 5;
}

message ScrapedJob {
  string          external_id     = 1;
  string          source_url      = 2;
  string          title           = 3;
  string          company_name    = 4;
  string          description     = 5;
  string          location        = 6;
  repeated string application_url = 7;
}

message IngestJobsResponse {
  int32 received = 1;
  optional int32 created = 2;
  optional int32 updated = 3;
  optional int32 observed = 4;
}

message WorkerRequest {
  string worker_id = 1;
  repeated string source_ids = 2;
  optional string run_id = 3;
  optional string lease_token = 4;
  string payload_json = 5;
}
message WorkerResponse { string payload_json = 1; }
